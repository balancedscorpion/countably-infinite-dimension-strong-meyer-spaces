    "name": "A strongly tempered Meyer space of countably infinite Hamel dimension",
    "description": "There exists a locally finite carrier Λ in the real line whose whole complex strongly tempered Meyer space has Hamel dimension ℵ₀. Both a tempered distribution and its distributional Fourier transform have local atomic formulas on Λ, with coefficient families whose absolute values are summable after division by some polynomial weight (1 + |x|)^N. The same carrier supports the entire space; finite-dimensional exponent layers prove the rank upper bound and independent original parity modes prove the lower bound. The radius schedule is selected classically. This is an existence theorem for one carrier, not an effective construction or a classification of all carriers.",
